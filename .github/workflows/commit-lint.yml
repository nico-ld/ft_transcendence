name: commit-lint
on: pull_request

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun i -d @commitlint/cli @commitlint/config-conventional
      - run: bunx commitlint --from=origin/master --to=HEAD
