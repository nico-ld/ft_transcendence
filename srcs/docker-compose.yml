services:
  nginx:
    build: ./nginx
    ports:
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - ft_silk_space

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost/api
    expose:
      - "3000"
    networks:
      - ft_silk_space

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/silk_space_db
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_silk_space

  db:
    build: ./postgres
    env_file: ./postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_silk_space

volumes:
  postgres_data:

networks:
  ft_silk_space:
    driver: bridge
