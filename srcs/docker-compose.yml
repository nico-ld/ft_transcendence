services:
  nginx:
    build: ./nginx
    ports:
      - "6767:6767"
    depends_on:
      - frontend
      - backend
    networks:
      - ft_silk_space

  frontend:
    build: ./frontend
    expose:
      - "3000"
    networks:
      - ft_silk_space

  backend:
    build:
       context: .
       dockerfile: ./backend/Dockerfile
    env_file:
        - ./backend/.env
        - ./postgres/.env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_silk_space
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  db:
    build: ./postgres
    env_file: ./postgres/.env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_silk_space

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ft_silk_space
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    pid: host
    command: ["--enable_metrics=cpu,memory,network"]
    volumes:
      - /:/rootfs:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${XDG_RUNTIME_DIR}/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    # prometheus scrapes it through ft_silk_space, no need to publish it
    expose:
      - "8080"
    networks:
      - ft_silk_space

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus       # change this
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - ft_silk_space   

volumes:
  postgres_data:
  prometheus-data:
  grafana-data:

networks:
  ft_silk_space:
    driver: bridge
