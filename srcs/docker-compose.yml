services:
  nginx:
    build: ./nginx
    ports:
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - ft_silk_space

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost/api
    expose:
      - "3000"
    networks:
      - ft_silk_space

  backend:
    build:
       context: .
       dockerfile: ./backend/Dockerfile
    env_file:
        - ./backend/.env
        - ./postgres/.env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_silk_space
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  db:
    build: ./postgres
    env_file: ./postgres/.env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_silk_space

volumes:
  postgres_data:

networks:
  ft_silk_space:
    driver: bridge
