services:
  nginx:
    build: ./nginx
    ports:
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - ft_silk_space

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - ft_silk_space

  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - ft_silk_space

  db:
    image: postgres:18.6-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_silk_space

volumes:
  postgres_data:

networks:
  ft_silk_space:
    driver: bridge
