services:
  nginx:
    build: ./nginx
    ports:
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - ft_silk_space

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost/api
    expose:
      - "3000"
    networks:
      - ft_silk_space

  backend:
    build:
       context: .
       dockerfile: ./backend/Dockerfile
    env_file:
        - ./backend/.env
        - ./postgres/.env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_silk_space
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  db:
    build: ./postgres
    env_file: ./postgres/.env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_silk_space

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # ← Add this
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ft_silk_space
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker API
      - /sys/fs/cgroup:/sys/fs/cgroup:ro                # (CPU, mem, ...)
      - /var/lib/docker/:/var/lib/docker:ro            # Container filesystem
      - /proc:/host/proc:ro                              # Process info
    ports:
      - "8081:8080"  # to debug, remove it when pushing
    networks:
      - ft_silk_space

volumes:
  postgres_data:
  prometheus-data:

networks:
  ft_silk_space:
    driver: bridge
