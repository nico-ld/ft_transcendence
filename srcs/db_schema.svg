<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font-weight: bold; font-size: 14px; }
    .cell { font-family: Arial, sans-serif; font-size: 12px; text-anchor: "start"; }
    .user { fill: #e6f3ff; stroke: #4682b4; stroke-width: 2; }
    .session { fill: #e6ffe6; stroke: #2e8b57; stroke-width: 2; }
    .terminal { fill: #ffe6e6; stroke: #dc143c; stroke-width: 2; }
    .line { stroke: #ff6600; stroke-width: 2; fill: none; marker-end: url(#triangle); }
    .arrow { fill: #ff6600; stroke: #ff6600; stroke-width: 1; }
    .constraint { font-style: italic; color: #000; font-size: 11px; text-anchor: "middle"; }
    .table-header { font-weight: bold; font-size: 14px; text-anchor: "middle"; }
  </style>
  <defs>
    <marker id="triangle" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#ff6600" />
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="500" fill="white" />

  <!-- User Table -->
  <rect x="100" y="120" width="170" height="250" rx="8" ry="8" class="user"/>
  <text x="170" y="140" class="table-header">User</text>

  <text x="120" y="150" class="cell">id</text>
  <text x="120" y="170" class="cell">email</text>
  <text x="120" y="190" class="cell">password_hash *</text>
  <text x="120" y="210" class="cell">ft_id *</text>
  <text x="120" y="230" class="cell">username</text>
  <text x="120" y="250" class="cell">first_name</text>
  <text x="120" y="270" class="cell">last_name</text>
  <text x="120" y="290" class="cell">avatar</text>
  <text x="120" y="310" class="cell">role</text>
  <text x="120" y="330" class="cell">job</text>
  <text x="120" y="350" class="cell">created_at</text>

  <!-- Friend Table -->
  <rect x="400" y="30" width="170" height="80" rx="8" ry="8" class="session"/>
  <text x="450" y="55" class="table-header">Friend</text>

  <text x="420" y="80" class="cell">user_id</text>
  <text x="420" y="100" class="cell">friend_id</text>

  <!-- UserSession Table -->
  <rect x="400" y="130" width="170" height="120" rx="8" ry="8" class="session"/>
  <text x="450" y="155" class="table-header">UserSession</text>

  <text x="420" y="180" class="cell">id</text>
  <text x="420" y="200" class="cell">user_id</text>
  <text x="420" y="220" class="cell">created_at</text>
  <text x="420" y="240" class="cell">expires_at</text>

  <!-- TerminalSession Table -->
  <rect x="400" y="280" width="170" height="120" rx="8" ry="8" class="terminal"/>
  <text x="435" y="305" class="table-header">TerminalSession</text>

  <text x="420" y="330" class="cell">id</text>
  <text x="420" y="350" class="cell">user_id</text>
  <text x="420" y="370" class="cell">started_at</text>
  <text x="420" y="390" class="cell">last_seen_at</text>

  <!-- Relationships -->
  <line x1="200" y1="150" x2="400" y2="80" class="line"/>
  <line x1="200" y1="150" x2="400" y2="100" class="line"/>
  <line x1="200" y1="205" x2="400" y2="180" class="line"/>
  <line x1="200" y1="150" x2="400" y2="200" class="line"/>
  <line x1="200" y1="150" x2="400" y2="350" class="line"/>

  <line x1="200" y1="205" x2="400" y2="330" class="line"/>

  <!-- Constraint -->
  <text x="100" y="400" class="constraint">* password_hash is null if connected with 42</text>
  <text x="100" y="410" class="constraint">* fd_id null if not connected with 42</text>
</svg>