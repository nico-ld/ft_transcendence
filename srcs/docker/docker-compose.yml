services:
  nginx:
    build: ./nginx
    ports:
      - "6767:6767"
    depends_on:
      - frontend
      - backend
      - grafana
    networks:
      - ft_silk_space

  frontend:
    build: ../frontend
    expose:
      - "3000"
    networks:
      - ft_silk_space

  backend:
    build: ../backend
    env_file:
        - ../backend/.env
        - ./postgres/.env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_silk_space
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  db:
    build: ./postgres
    env_file: ./postgres/.env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_silk_space

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    networks:
      - ft_silk_space
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    pid: host
    command: ["--enable_metrics=cpu,memory,network"]
    volumes:
      - /:/rootfs:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${XDG_RUNTIME_DIR}/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    expose:
      - "8080"
    networks:
      - ft_silk_space

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # the admin dash shows it in an iframe
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # nginx asks the backend if the session is admin via auth_request then
      # names the account in X-WEBAUTH-USER grafana trusts it and it's only reachable
      # via nginx
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=email
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      # grafana admin account not used to log in but not left as admin/admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in srcs/.env}
    networks:
      - ft_silk_space

volumes:
  postgres_data:
  prometheus-data:
  grafana-data:

networks:
  ft_silk_space:
    driver: bridge
